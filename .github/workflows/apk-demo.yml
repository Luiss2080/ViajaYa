# Compila el APK de depuracion y lo deja publicado en Releases, para que la
# demo tenga un enlace de descarga estable. ViajaYa es Android nativo: no hay
# version web posible, asi que el "deploy" de este proyecto es el APK.
name: APK de demostracion

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Permisos del wrapper
        run: chmod +x ./gradlew
      - name: Compilar debug
        run: ./gradlew assembleDebug --stacktrace
      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: viajaya-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar el APK en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if gh release view demo >/dev/null 2>&1; then
            gh release upload demo "$APK" --clobber
          else
            gh release create demo "$APK" \
              --title "ViajaYa - APK de demostracion" \
              --notes "APK de depuracion compilado desde la rama demo. Prototipo parcial: inicio de sesion, gestion de usuarios y calculadora de tarifas."
          fi
